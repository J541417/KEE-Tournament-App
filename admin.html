<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Kee Golf League Admin</title>

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page-shell">
    <section class="card admin-card">
      <div class="header">
        <div>
          <p class="eyebrow">Kee Golf League</p>
          <h1>Admin Panel</h1>
        </div>

        <div class="badge" id="adminStatusBadge">Locked</div>
      </div>

      <form id="loginForm" class="lookup-form" onsubmit="event.preventDefault();">
        <label for="adminPassword">Admin Password</label>

        <div class="input-row">
          <input
            id="adminPassword"
            name="adminPassword"
            type="password"
            autocomplete="current-password"
            required
          />

          <button type="submit">Log In</button>
        </div>
      </form>

      <section id="adminPanel" class="hidden">
        
        <section id="currentRoundPanel" class="round-panel hidden" style="border: 2px solid var(--primary); margin-bottom: 2rem;">
          <h2>⛳ Current Active Round</h2>
          <div style="margin: 1.5rem 0; font-size: 1.1rem; line-height: 1.8;">
            <div><strong>Date:</strong> <span id="displayRoundDate">Loading...</span></div>
            <div><strong>Course:</strong> <span id="displayCourse">Loading...</span></div>
            <div><strong>Format:</strong> <span id="displayFormat">Loading...</span></div>
          </div>
          <div style="display: flex; gap: 1rem; flex-wrap: wrap;">
            <button onclick="goToScorecard()" class="nav-button" type="button">Go to Scorecard</button>
            <button id="deleteRoundBtn" type="button" style="background: var(--danger-bg); color: var(--danger-text); border: none;">Delete Round</button>
          </div>
        </section>

        <section class="round-panel">
          <h2>Create / Replace Active Round</h2>

          <div class="admin-grid">
            <label>
              Round Date
              <input id="roundDate" type="date" required />
            </label>

            <label>
              Course
              <select id="courseSelect" required>
                <option value="">Loading courses...</option>
              </select>
            </label>

            <label>
              Scoring Mode
              <select id="scoringMode" required>
                <option value="team">Team scoring</option>
                <option value="individual">Individual scoring</option>
              </select>
            </label>

            <label>
              Number of Teams
              <input id="teamCount" type="number" min="1" max="20" value="2" required />
            </label>
          </div>

          <button id="buildTeamsButton" type="button">
            Build Team Boxes
          </button>
        </section>

        <section id="teamsContainer" class="teams-container hidden"></section>

        <button id="saveRoundButton" type="button" class="hidden">
          Set Active Round
        </button>

        <p class="muted">
          Setting a new round will overwrite the active round and wipe existing temporary data from the data tab.
        </p>
      </section>

      <section id="message" class="message hidden"></section>
    </section>
  </main>

  <script src="admin.js?v=9"></script>
</body>
</html>
