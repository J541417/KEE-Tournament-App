<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Golf League</title>

  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <main class="page-shell">
    <section class="card">
      <div class="header">
        <div>
          <p class="eyebrow">Welcome to</p>
          <h1 id="leagueName">Golf League</h1>
        </div>

        <div class="badge" id="roundStatusBadge">Loading</div>
      </div>

      <section class="round-panel" id="roundPanel">
        <h2>Active Round</h2>

        <div id="roundLoading" class="muted">
          Loading active round...
        </div>

        <div id="roundDetails" class="round-details hidden">
          <div class="detail-row">
            <span>Date</span>
            <strong id="roundDate">-</strong>
          </div>

          <div class="detail-row">
            <span>Course</span>
            <strong id="courseName">-</strong>
          </div>

          <div class="detail-row">
            <span>Scoring</span>
            <strong id="scoringMode">-</strong>
          </div>
        </div>

        <div id="noActiveRound" class="notice hidden">
          There is not an active round yet. Please check back after the admin sets the round.
        </div>
      </section>

      <form id="lookupForm" class="lookup-form hidden">
        <label for="lastName">Enter your last name</label>

        <div class="input-row">
          <input
            id="lastName"
            name="lastName"
            type="text"
            autocomplete="family-name"
            required
          />

          <button type="submit">Find My Scorecard</button>
        </div>
      </form>

      <section id="message" class="message hidden"></section>

      <section id="matches" class="matches hidden"></section>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
