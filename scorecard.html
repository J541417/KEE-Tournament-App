<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Scorecard</title>

  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <main class="page-shell">
    <section class="card">
      <h1>Scorecard</h1>

      <p class="muted">
        The landing page is routing correctly. The scorecard screen will be built next.
      </p>

      <p id="tokenDisplay" class="notice"></p>
    </section>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get("token");

    document.getElementById("tokenDisplay").textContent = token
      ? "Scorecard token received."
      : "No scorecard token was provided.";
  </script>
</body>
</html>
