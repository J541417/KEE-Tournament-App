<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Kee Golf League Scorecard</title>

  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <main class="page-shell">
    <section class="card scorecard-card">
      <div class="header">
        <div>
          <p class="eyebrow">Kee Golf League</p>
          <h1>Scorecard</h1>
        </div>

        <div class="badge" id="scorecardBadge">Loading</div>
      </div>

      <section class="round-panel">
        <h2 id="courseName">Course</h2>

        <div class="round-details">
          <div class="detail-row">
            <span>Round Date</span>
            <strong id="roundDate">-</strong>
          </div>

          <div class="detail-row">
            <span>Scoring</span>
            <strong id="scoringMode">-</strong>
          </div>

          <div class="detail-row">
            <span>Logged In As</span>
            <strong id="loggedInPlayer">-</strong>
          </div>
        </div>
      </section>

      <section class="round-panel">
        <div class="hole-nav-header">
          <h2>Choose Hole</h2>
          <div class="badge" id="currentHoleBadge">Hole 1</div>
        </div>

        <div id="holeNav" class="hole-nav"></div>
      </section>

      <section class="round-panel">
        <div class="hole-nav-header">
          <div>
            <p class="eyebrow">Current Hole</p>
            <h2 id="holeTitle">Hole 1</h2>
          </div>

          <div class="team-rating" id="parBadge">Par -</div>
        </div>

        <div id="teamsList" class="teams-container"></div>
      </section>

      <section id="message" class="message hidden"></section>
    </section>
  </main>

  <script src="/scorecard.js"></script>
</body>
</html>
