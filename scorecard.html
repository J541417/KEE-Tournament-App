<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Kee Golf League Scorecard</title>

  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <main class="page-shell">
    <section class="card scorecard-card">
      <div class="header">
        <div>
          <p class="eyebrow">Kee Golf League</p>
          <h1>Scorecard</h1>
        </div>

        <div class="badge" id="scorecardBadge">Loading</div>
      </div>

      <section class="round-panel">
        <h2 id="courseName">Course</h2>

        <div class="round-details">
          <div class="detail-row">
            <span>Round Date</span>
            <strong id="roundDate">-</strong>
          </div>

          <div class="detail-row">
            <span>Scoring</span>
            <strong id="scoringMode">-</strong>
          </div>

          <div class="detail-row">
            <span>Logged In As</span>
            <strong id="loggedInPlayer">-</strong>
          </div>
        </div>

        <div id="scorecardAdminActions" class="admin-options hidden">
          <button id="scorecardAdminButton" type="button" class="secondary-button">
            Go to Admin Panel
          </button>
        </div>
      </section>

      <section id="scorecardView">
        <section class="round-panel">
          <div class="scorecard-toolbar">
            <button id="prevHoleWindowButton" type="button" class="secondary-button">
              Back Holes
            </button>

            <div>
              <p class="eyebrow">Showing</p>
              <h2 id="holeWindowLabel">Holes 1-5</h2>
            </div>

            <button id="nextHoleWindowButton" type="button" class="secondary-button">
              Next Holes
            </button>
          </div>

          <button id="toggleFullCardButton" type="button" class="secondary-button full-width-button">
            Show Entire Card
          </button>

          <div id="scorecardTableWrapper" class="scorecard-table-wrapper"></div>
        </section>
      </section>

      <section id="scoreEntryView" class="hidden">
        <section class="round-panel score-entry-panel">
          <div class="hole-nav-header">
            <div>
              <p class="eyebrow" id="entryTypeLabel">Team</p>
              <h2 id="entryParticipantName">Team 1</h2>
            </div>

            <div class="team-rating" id="entryParBadge">
              Par -
            </div>
          </div>

          <div class="round-details">
            <div class="detail-row">
              <span>Course</span>
              <strong id="entryCourseName">-</strong>
            </div>

            <div class="detail-row">
              <span>Hole</span>
              <strong id="entryHoleNumber">-</strong>
            </div>

            <div class="detail-row">
              <span>Current Score</span>
              <strong id="entryCurrentScore">-</strong>
            </div>
          </div>

          <label class="score-input-label" for="entryScoreInput">
            Enter Score
          </label>

          <input
            id="entryScoreInput"
            type="number"
            min="1"
            max="20"
            inputmode="numeric"
            placeholder="Score"
          />

          <div class="score-entry-actions">
            <button id="prevEntryHoleButton" type="button" class="secondary-button">
              Back Hole
            </button>

            <button id="saveEntryScoreButton" type="button">
              Save Score
            </button>

            <button id="nextEntryHoleButton" type="button" class="secondary-button">
              Next Hole
            </button>
          </div>

          <button id="returnToScorecardButton" type="button" class="secondary-button full-width-button">
            Return to Scorecard
          </button>
        </section>
      </section>

      <section id="message" class="message hidden"></section>
    </section>
  </main>

  <script src="/scorecard.js"></script>
</body>
</html>
