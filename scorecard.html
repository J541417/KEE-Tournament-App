<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Kee Golf League Scorecard</title>

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page-shell">
    <section class="card scorecard-card compact-scorecard-card">
      <div class="scorecard-top-bar">
        <div>
          <p class="eyebrow">Kee Golf League</p>
          <h1 id="courseName">Scorecard</h1>
        </div>

        <div class="scorecard-top-actions">
          <button id="scorecardAdminButton" type="button" class="secondary-button hidden">
            Admin
          </button>

          <div class="badge" id="scorecardBadge">Loading</div>
        </div>
      </div>

      <section id="scorecardView">
        <div class="scorecard-toolbar compact-toolbar">
          <button id="prevHoleWindowButton" type="button" class="secondary-button">
            Back
          </button>

          <div>
            <p class="eyebrow">Showing</p>
            <h2 id="holeWindowLabel">Holes 1-5</h2>
          </div>

          <button id="nextHoleWindowButton" type="button" class="secondary-button">
            Next
          </button>
        </div>

        <button id="toggleFullCardButton" type="button" class="secondary-button full-width-button">
          Show Entire Card
        </button>

        <div id="scorecardTableWrapper" class="scorecard-table-wrapper"></div>
      </section>

      <section id="scoreEntryView" class="hidden">
        <section class="score-entry-simple">
          <p class="eyebrow" id="entryTypeLabel">Team Score</p>

          <h1 id="entryMainTitle">Michigan Meadows Hole 1</h1>

          <div class="entry-subtitle">
            <span id="entryParticipantName">Team 1</span>
            <span id="entryParBadge">Par 4</span>
          </div>

          <label class="score-input-label centered-label" for="entryScoreInput">
            Enter Score
          </label>

          <input
            id="entryScoreInput"
            class="big-score-input"
            type="number"
            min="1"
            max="20"
            inputmode="numeric"
            placeholder="Score"
          />

          <button id="saveEntryScoreButton" type="button" class="big-save-button">
            Save Score
          </button>

          <div class="score-entry-actions">
            <button id="prevEntryHoleButton" type="button" class="secondary-button">
              Back Hole
            </button>

            <button id="nextEntryHoleButton" type="button" class="secondary-button">
              Next Hole
            </button>
          </div>

          <button id="returnToScorecardButton" type="button" class="secondary-button full-width-button">
            Return to Scorecard
          </button>
        </section>
      </section>

      <section id="message" class="message hidden"></section>
    </section>
  </main>

  <script src="scorecard.js"></script>
</body>
</html>
