<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Kee Golf League - Scorecard</title>

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page-shell">
    <section class="card admin-card">
      <div class="header">
        <div>
          <p class="eyebrow">Kee Golf League</p>
          <h1 id="courseName">Scorecard</h1>
          <p id="scorecardDate" style="color: var(--muted-text); font-size: 0.9rem; margin-top: 0.25rem;"></p>
        </div>

        <div class="badge" id="scorecardBadge">Loading...</div>
      </div>

      <button id="scorecardAdminButton" type="button" class="nav-button hidden" style="margin-bottom: 1.5rem; background: var(--primary-dark); color: white;">
        ⚙️ Return to Admin Panel
      </button>

      <section id="scorecardView">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
          <button id="prevHoleWindowButton" class="nav-button" type="button">Back</button>
          
          <div style="text-align: center;">
            <span style="font-size: 0.75rem; text-transform: uppercase; color: var(--muted-text); font-weight: 600;">Showing</span><br/>
            <strong id="holeWindowLabel" style="font-size: 1.1rem;">Holes 1-5</strong>
          </div>
          
          <button id="nextHoleWindowButton" class="nav-button" type="button">Next</button>
        </div>

        <div style="display: flex; gap: 0.5rem; margin-bottom: 1.5rem;">
          <button id="toggleFullCardButton" class="nav-button" type="button" style="flex: 1;">
            Show Entire Card
          </button>
          <button id="globalEnterScoresButton" type="button" style="flex: 1; padding: 0.5rem; font-size: 1rem;">
            Enter Scores
          </button>
        </div>

        <div id="scorecardTableWrapper" style="overflow-x: auto; margin-bottom: 1rem;">
          </div>
      </section>

      <section id="scoreEntryView" class="hidden">
        <div style="text-align: center; margin-bottom: 1.5rem; padding: 1rem; border: 1px solid var(--border-color); border-radius: 8px; background: #fdfdfd;">
          <p id="entryTypeLabel" class="eyebrow">Score Entry</p>
          <h2 id="entryMainTitle" style="margin: 0.5rem 0;">Hole</h2>
          <h3 id="entryParticipantName" style="color: var(--primary);">Player</h3>
          <div id="entryParBadge" class="badge" style="margin: 0.75rem auto 0 auto;">Par -</div>
        </div>

        <div style="display: flex; justify-content: center; align-items: center; gap: 1rem; margin-bottom: 1rem;">
          <button id="prevEntryHoleButton" class="nav-button" type="button">&larr; Prev</button>
          
          <input 
            id="entryScoreInput" 
            type="number" 
            style="width: 80px; text-align: center; font-size: 1.5rem; padding: 0.5rem;" 
            placeholder="-" 
          />
          
          <button id="nextEntryHoleButton" class="nav-button" type="button">Next &rarr;</button>
        </div>

        <div style="text-align: center; margin-bottom: 1.5rem;">
          <label for="jumpToHoleSelect" style="font-weight: 700; margin-right: 8px;">Jump to Hole:</label>
          <select id="jumpToHoleSelect" style="width: auto; display: inline-block; padding: 8px 12px; font-size: 1rem;">
            <option value="1">Hole 1</option>
            <option value="2">Hole 2</option>
            <option value="3">Hole 3</option>
            <option value="4">Hole 4</option>
            <option value="5">Hole 5</option>
            <option value="6">Hole 6</option>
            <option value="7">Hole 7</option>
            <option value="8">Hole 8</option>
            <option value="9">Hole 9</option>
            <option value="10">Hole 10</option>
            <option value="11">Hole 11</option>
            <option value="12">Hole 12</option>
            <option value="13">Hole 13</option>
            <option value="14">Hole 14</option>
            <option value="15">Hole 15</option>
            <option value="16">Hole 16</option>
            <option value="17">Hole 17</option>
            <option value="18">Hole 18</option>
          </select>
        </div>

        <div style="display: flex; flex-direction: column; gap: 0.75rem;">
          <button id="saveEntryScoreButton" type="button" style="padding: 0.75rem; font-size: 1.1rem;">
            Save & Close
          </button>
          <button id="returnToScorecardButton" type="button" class="nav-button" style="padding: 0.75rem; font-size: 1.1rem;">
            Return to Scorecard
          </button>
        </div>
      </section>

      <section id="message" class="message hidden"></section>
    </section>
  </main>

  <script src="scorecard.js?v=6"></script>
</body>
</html>
